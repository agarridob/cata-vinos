<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cata · In Vino Veritas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍷</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=2.3.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div id="root"></div>

<div id="photo-overlay" class="photo-overlay" role="dialog" aria-label="Foto ampliada">
  <button class="photo-overlay-close" aria-label="Cerrar">✕</button>
  <img alt="">
</div>

<div id="onboarding" class="modal-overlay" role="dialog" aria-label="Identifícate">
  <div class="modal-card">
    <button class="modal-close" id="onboard-close" aria-label="Cerrar">✕</button>
    <div class="modal-card-header">
      <div class="modal-card-eyebrow" id="onboard-eyebrow">Bienvenido a</div>
      <div class="modal-card-title">In Vino Veritas</div>
    </div>
    <p class="modal-card-intro" id="onboard-intro">
      Identifícate para votar los vinos.<br>
      Tu <strong>color</strong> es el marcador de tu copa.
    </p>
    <div id="onboard-error" class="modal-error hidden"></div>

    <div class="modal-section-label">Elige tu color</div>
    <div class="modal-color-grid" id="onboard-color-grid"></div>
    <div class="modal-color-hint" id="onboard-color-hint">&nbsp;</div>

    <div class="modal-section-label">
      Tu nombre <span class="optional">(opcional)</span>
    </div>
    <input id="onboard-name" type="text" class="modal-name-input"
           placeholder="Ej. Alberto. Si lo dejas vacío, te llamamos por una uva"
           maxlength="40">

    <button id="onboard-submit" class="modal-btn-primary">Empezar a votar</button>
    <button id="onboard-cancel" class="modal-btn-secondary" style="display:none">Cancelar</button>
  </div>
</div>

<div id="qr-widget" title="Escanea para ver esta pantalla en tu móvil">
  <div id="qr-img"></div>
  <div class="qr-label">Escanea para<br>ver en tu móvil</div>
</div>

<button id="fs-btn" title="Pantalla completa" aria-label="Pantalla completa">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7V3h4"></path>
    <path d="M17 3h4v4"></path>
    <path d="M21 17v4h-4"></path>
    <path d="M7 21H3v-4"></path>
  </svg>
</button>
<div id="version-tag">v2.3.0</div>

<svg id="bottle-fallback" style="display:none;" viewBox="0 0 100 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="botfb" x1="0" x2="1">
      <stop offset="0" stop-color="#c8a878"/>
      <stop offset="0.5" stop-color="#d8b888"/>
      <stop offset="1" stop-color="#a88858"/>
    </linearGradient>
  </defs>
  <rect x="42" y="2" width="16" height="14" fill="#8a5a2a"/>
  <rect x="40" y="14" width="20" height="50" fill="url(#botfb)"/>
  <path d="M 40 60 Q 25 70 22 95 L 22 270 Q 22 278 30 278 L 70 278 Q 78 278 78 270 L 78 95 Q 75 70 60 60 Z" fill="url(#botfb)"/>
  <rect x="28" y="130" width="44" height="60" fill="#f5ecd5" opacity="0.6"/>
</svg>
<script src="{{ url_for('static', filename='js/app/app-core.js') }}?v=2.3.0"></script>
<script src="{{ url_for('static', filename='js/app/app-maps.js') }}?v=2.3.0"></script>
<script src="{{ url_for('static', filename='js/app/app-wine-view.js') }}?v=2.3.0"></script>
<script src="{{ url_for('static', filename='js/app/app-duel-view.js') }}?v=2.3.0"></script>
<script src="{{ url_for('static', filename='js/app/app-summary.js') }}?v=2.3.0"></script>
<script src="{{ url_for('static', filename='js/app/app-welcome.js') }}?v=2.3.0"></script>
<script src="{{ url_for('static', filename='js/app/app-popups.js') }}?v=2.3.0"></script>
<script src="{{ url_for('static', filename='js/app/app-vote-alert.js') }}?v=2.3.0"></script>
<script src="{{ url_for('static', filename='js/app/app-voting.js') }}?v=2.3.0"></script>
</body>
</html>
