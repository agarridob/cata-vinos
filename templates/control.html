<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5ecd5">
<title>Control · Cata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍷</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='css/control.css') }}?v=1.0.12">
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <div class="header-title-wrap">
        <div class="header-kicker">Panel anfitrión</div>
        <h1>In Vino Veritas</h1>
      </div>
      <form class="logout-form" method="post" action="/logout">
        <button class="logout-btn" type="submit">Cerrar sesión</button>
      </form>
    </div>
  </div>
  <div id="content">
    <div class="empty">Cargando…</div>
  </div>

  <div class="editor-section" id="wine-editor-section">
  <div class="admin-title">Editor visual de vinos</div>

  <div class="editor-actions">
    <button class="admin-btn admin-btn-warn" id="btn-load-editor">
      <span class="admin-btn-label">Cargar editor</span>
      <span class="admin-btn-sub">Lee data/wines.json</span>
    </button>

    <button class="admin-btn admin-btn-warn" id="btn-add-editor-wine">
      <span class="admin-btn-label">Añadir vino</span>
      <span class="admin-btn-sub">Crea una ficha vacía</span>
    </button>

    <button class="admin-btn admin-btn-danger wide" id="btn-save-editor">
      <span class="admin-btn-label">Guardar carta de vinos</span>
      <span class="admin-btn-sub">Actualiza wines.json y refresca la TV</span>
    </button>
  </div>

  <div class="editor-session">
    <label class="editor-label">Nombre de la sesión
      <input class="editor-input" id="editor-session-name" type="text" placeholder="Cata · Nombre">
    </label>
  </div>

  <div class="editor-status" id="wines-editor-status">
    Carga el editor para modificar la carta.
  </div>

  <div class="wine-editor-list" id="wines-editor-list"></div>
</div>


  <div id="archive-modal" class="archive-modal">
    <div class="archive-modal-card">
      <div class="archive-modal-title">Archivar y reiniciar</div>
      <div class="archive-modal-text">
        Se guardará una copia de la sesión completa (vinos, invitados y votos) y luego se reseteará todo. Los <strong>vinos del menú</strong> se mantienen.
      </div>
      <input id="archive-name" type="text" class="archive-modal-input"
             placeholder="Nombre (opcional, ej. Distrito Fam)" maxlength="60">
      <div class="archive-modal-actions">
        <button class="archive-modal-btn archive-modal-btn-cancel" id="archive-cancel">Cancelar</button>
        <button class="archive-modal-btn archive-modal-btn-confirm" id="archive-confirm">Archivar</button>
      </div>
    </div>
  </div>

  <div id="archive-toast" class="archive-toast"></div>

<script src="{{ url_for('static', filename='js/control.js') }}?v=1.0.12"></script>
</body>
</html>
